<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gusto — Testing Dashboard</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --ink:#e7e9ee;
            --soft:#9aa2b1; --green:#2ecc71; --amber:#f39c12; --red:#e74c3c;
            --accent:#6b8afd; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font:14px/1.5 system-ui, sans-serif; }
    header { display:flex; align-items:center; gap:16px; padding:14px 24px;
             border-bottom:1px solid var(--line); position:sticky; top:0;
             background:var(--bg); z-index:5; }
    header h1 { font-size:17px; margin:0; }
    header .status { color:var(--soft); font-size:12px; }
    a.btn, button { background:var(--accent); color:#fff; border:0;
             border-radius:8px; padding:7px 13px; cursor:pointer; font-weight:600;
             text-decoration:none; font-size:13px; }
    button.ghost { background:transparent; color:var(--accent);
                   border:1px solid var(--accent); }
    main { padding:24px; max-width:1200px; margin:0 auto; display:grid; gap:22px; }
    .outlet { background:var(--card); border:1px solid var(--line);
              border-radius:12px; overflow:hidden; }
    .outlet-head { display:flex; align-items:center; gap:12px; padding:14px 16px;
                   border-bottom:1px solid var(--line); }
    .outlet-head h2 { font-size:15px; margin:0; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line);
             vertical-align:middle; }
    th { color:var(--soft); font-weight:600; font-size:12px; }
    tr:last-child td { border-bottom:0; }
    .otp { font-family:ui-monospace, monospace; font-size:18px; font-weight:700;
           letter-spacing:2px; color:var(--accent); }
    .pill { display:inline-block; padding:2px 10px; border-radius:999px;
            font-size:12px; font-weight:700; white-space:nowrap; }
    .pill.open,.pill.PAID,.pill.RECEIVED { background:rgba(46,204,113,.15); color:var(--green); }
    .pill.closing_soon,.pill.PREPARING,.pill.READY { background:rgba(243,156,18,.15); color:var(--amber); }
    .pill.closed,.pill.CREATED,.pill.PENDING { background:rgba(231,76,60,.15); color:var(--red); }
    /* Terminal states. The day view keeps finished orders as the record of what
       happened, so they need to read as DONE at a glance and not compete with
       the orders still in play — hence deliberately dimmer than the live pills
       above, with cancelled/abandoned distinguished from a clean completion. */
    .pill.COMPLETED { background:rgba(46,204,113,.10); color:#6f8f7d; }
    .pill.CANCELLED,.pill.ABANDONED { background:rgba(231,76,60,.10); color:#a9736c; }
    /* A spent code, struck through — the same treatment the customer's own
       ticket gives it once collected. */
    tr.done .otp { color:var(--soft); text-decoration:line-through; }
    /* --- scheduled pickup / engine observability -------------------------
       A held order is deliberately AMBER, not green: it is paid and real but
       the restaurant cannot see it yet, which is a state worth reading as
       "in hand, not yet handed over". Released goes green because at that
       moment it has become an ordinary order on the tablet. */
    .pill.held { background:rgba(243,156,18,.15); color:var(--amber); }
    .pill.released { background:rgba(46,204,113,.15); color:var(--green); }
    .pill.retired,.pill.not_held { background:rgba(154,162,177,.15); color:var(--soft); }
    /* Tabular numerals so a ticking countdown does not jitter its own column
       width every second — the digits change, the layout must not. */
    .countdown { font-family:ui-monospace, monospace; font-variant-numeric:tabular-nums;
                 font-weight:700; white-space:nowrap; }
    .countdown.due { color:var(--green); }
    .num { font-family:ui-monospace, monospace; font-variant-numeric:tabular-nums;
           white-space:nowrap; }
    .math { color:var(--soft); font-size:12px; white-space:nowrap; }
    .ident { display:flex; flex-direction:column; gap:2px; }
    .ident .raw { color:var(--soft); font-size:12px; }
    .label-edit { background:#0f1115; border:1px dashed var(--line); color:var(--ink);
                  border-radius:6px; padding:4px 8px; font-size:13px; width:170px; }
    .label-edit:focus { border-style:solid; border-color:var(--accent); outline:none; }
    .empty { color:var(--soft); padding:14px 16px; }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .col h3 { font-size:13px; margin:0 0 8px; }
    .col.ordered h3 { color:var(--green); } .col.pending h3 { color:var(--red); }
    ul { list-style:none; margin:0; padding:0; }
    li { padding:6px 0; border-bottom:1px solid var(--line); }
    .muted { color:var(--soft); }
  </style>
</head>
<body>
  <header>
    <h1>Gusto — Testing Dashboard</h1>
    <span class="status" id="status">loading…</span>
    <span style="flex:1"></span>
    <button class="ghost" onclick="refreshAll()">Refresh</button>
    <a class="btn" href="/logout">Log out</a>
  </header>

  <main>
    <!-- ONE flat table for every restaurant, newest order first. It used to be
         a section per outlet; with several restaurants live at once that buried
         the newest order somewhere down the third group, which is the opposite
         of what someone driving orders manually needs. The restaurant is a
         column now, not a heading. -->
    <div class="outlet">
      <div class="outlet-head">
        <h2>Orders</h2>
        <span class="muted" id="order-count"></span>
        <span style="flex:1"></span>
        <label class="muted" for="day">Day</label>
        <input type="date" id="day" onchange="refreshAll()">
        <button class="ghost" onclick="setDay(istToday())">Today</button>
      </div>
      <div id="orders"></div>
    </div>

    <!-- Engine observability for scheduled pickup (migration 031).
         Sits directly under Orders because it explains a row that is MISSING
         from the restaurant's tablet: a held order is paid, real and invisible
         to the outlet, and this is the only surface that says why and for how
         much longer. Every number that produced the release moment is on the
         row next to the countdown, so the moment can be checked rather than
         trusted. -->
    <div class="outlet">
      <div class="outlet-head">
        <h2>Scheduled pickups</h2>
        <span class="muted" id="scheduled-count"></span>
        <span style="flex:1"></span>
        <span class="muted" style="font-size:12px">release_at = requested − (mu_ready_s + margin), re-derived every poll</span>
      </div>
      <div id="scheduled"></div>
    </div>

    <div class="outlet">
      <div class="outlet-head"><h2>Restaurants</h2></div>
      <div id="outlets" style="padding:12px 16px"></div>
    </div>

    <div class="outlet">
      <div class="outlet-head"><h2>Testers — ordered today</h2>
        <span class="muted" id="window-label"></span></div>
      <div style="padding:16px" class="cols">
        <div class="col ordered"><h3>✓ Ordered</h3><ul id="ordered"></ul></div>
        <div class="col pending"><h3>✗ Not yet</h3><ul id="not-ordered"></ul></div>
      </div>
    </div>
  </main>

  <script>
    // NOTE: this page calls only THIS app's same-origin /api/* routes. It never
    // sees TESTING_DASHBOARD_KEY — the server attaches that when it calls the
    // backend. There is deliberately no key anywhere in this file.
    // Retry budget for READS, in ms: one retry after 3s, a second after 8s.
    // Sized for the backend's free-tier cold start (~45s to first byte) and
    // for momentary edge throttling, both of which resolve on their own.
    const READ_RETRY_DELAYS = [3000, 8000];
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    async function api(path, opts = {}) {
      // RETRIES ARE FOR READS ONLY, and that restriction is the whole safety
      // argument. Every mutating action on this page goes through this same
      // helper — approve, ready, reject, deliver, saveLabel — and a 5xx does
      // NOT mean the server did nothing: it may have advanced the order and
      // then failed on the way back. Repeating that automatically could apply
      // it twice.
      //
      // Deliver is the sharpest case. It runs the real verify_pickup, which
      // counts a failed attempt against a per-outlet miss cap and answers 429
      // once the cap is hit. Retrying a 429 there would spend more of the very
      // budget that produced the 429, and could lock the whole outlet out of
      // pickups for other staff. Reads cannot do that.
      const isRead = !opts.method || opts.method.toUpperCase() === 'GET';
      const delays = isRead ? READ_RETRY_DELAYS : [];

      for (let attempt = 0; ; attempt++) {
        const res = await fetch(path, {
          ...opts,
          headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        });
        // Never retried, whatever the budget says: the session is gone and no
        // amount of waiting brings it back.
        if (res.status === 401) { location.href = '/login'; throw new Error('401'); }
        if (res.ok) return res.status === 200 ? res.json() : null;

        // 429 and 5xx only. A 4xx is the server saying the request itself is
        // wrong — repeating it verbatim gets the same answer more slowly and
        // buries the real cause under retry noise.
        const transient = res.status === 429 || res.status >= 500;
        if (transient && attempt < delays.length) {
          await sleep(delays[attempt]);
          continue;
        }
        // Budget exhausted, or never eligible. NOW the caller sees it, and
        // refreshAll turns it into the visible error state.
        throw new Error(path + ' → ' + res.status);
      }
    }
    // ' is escaped too, so single-quoted attribute values are safe as well as
    // double-quoted ones. This is defence in depth for the ordinary HTML
    // contexts (data-ident=, value=, table cells); it is NOT what makes the
    // action buttons safe — see the note on actionButtons below for why
    // escaping alone cannot fix data interpolated into an onclick.
    const esc = s => (s ?? '').toString().replace(/[<&>"']/g,
      c => ({ '<':'&lt;','&':'&amp;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const pill = (cls, label) => `<span class="pill ${esc(cls)}">${esc(label)}</span>`;

    async function saveLabel(input) {
      const ident = input.dataset.ident;
      await api('/api/labels/' + encodeURIComponent(ident),
        { method: 'PATCH', body: JSON.stringify({ label: input.value.trim() }) });
      input.dataset.saved = input.value.trim();
      loadCompliance();
    }

    // Approve / Ready / Reject reuse the backend testing routes, which call the
    // exact same advance_status / reject_order the owner_app staff button uses.
    // The buttons a row shows are decided server-side (can_approve / can_ready /
    // can_reject) — the client never re-derives the gate from the status text.
    async function approveOrder(id) {
      try {
        await api('/api/orders/' + encodeURIComponent(id) + '/approve',
          { method: 'POST', body: JSON.stringify({}) });
        refreshAll();
      } catch (e) { alert('Approve failed: ' + e.message); }
    }
    async function readyOrder(id) {
      try {
        await api('/api/orders/' + encodeURIComponent(id) + '/ready',
          { method: 'POST', body: JSON.stringify({}) });
        // A roster order auto-picks-up on reaching READY and lands on
        // COMPLETED; a non-roster one stops at READY. Refreshing covers both
        // without the page needing to know which happened.
        refreshAll();
      } catch (e) { alert('Ready failed: ' + e.message); }
    }
    async function rejectOrder(id) {
      const reason = (prompt('Reason for rejecting? (optional)') || '').trim();
      try {
        await api('/api/orders/' + encodeURIComponent(id) + '/reject',
          { method: 'POST', body: JSON.stringify({ reason }) });
        // The row STAYS, now CANCELLED and buttonless — the day view keeps the
        // record of what happened rather than making it disappear.
        refreshAll();
      } catch (e) { alert('Reject failed: ' + e.message); }
    }
    // Delivered = the real counter verification (verify_pickup with this
    // order's own code), not a status write. The order becomes COMPLETED and
    // the row stays, marked done — same as Reject.
    async function deliverOrder(id) {
      try {
        const r = await api('/api/orders/' + encodeURIComponent(id) + '/deliver',
          { method: 'POST', body: JSON.stringify({}) });
        // verify_pickup answers rather than throwing when it declines — e.g. it
        // expired the order on its way in. Say so instead of silently doing
        // nothing, or the row just reappears with no explanation.
        if (r && r.verified === false)
          alert('Not handed over: order is ' + (r.status || 'not verifiable') + '.');
        refreshAll();
      } catch (e) { alert('Delivered failed: ' + e.message); }
    }
    // Buttons carry their order id in a DATA ATTRIBUTE and are dispatched by
    // the delegated listener below — they do NOT build an onclick string.
    //
    // The old shape was `onclick="approveOrder('${esc(o.order_id)}')"`, which
    // interpolates server data into a JS string literal nested inside an HTML
    // attribute. esc() escapes < & > " but not ', so a single quote in
    // order_id closed the literal and everything after it ran as script.
    //
    // Note that simply adding ' to esc() would NOT have fixed this one. The
    // browser HTML-decodes an attribute value BEFORE the JS parser sees it, so
    // &#39; decodes straight back to ' and breaks out exactly as before. The
    // only reliable fix is to stop putting data into a JS parsing context,
    // which is what this does: the id now only ever lands in a quoted
    // attribute value, where escaping " is sufficient and true.
    const ACTIONS = {
      approve:  o => approveOrder(o),
      ready:    o => readyOrder(o),
      deliver:  o => deliverOrder(o),
      reject:   o => rejectOrder(o),
    };
    const actionButtons = o => {
      const b = [];
      const btn = (act, label, cls) =>
        `<button${cls ? ` class="${cls}"` : ''} data-act="${act}" ` +
        `data-order-id="${esc(o.order_id)}">${label}</button>`;
      if (o.can_approve) b.push(btn('approve', 'Approve'));
      // Never alongside Approve: can_ready is PREPARING-only and can_approve
      // stops before it, so the two are mutually exclusive server-side.
      if (o.can_ready)   b.push(btn('ready',   'Ready'));
      if (o.can_deliver) b.push(btn('deliver', 'Delivered'));
      if (o.can_reject)  b.push(btn('reject',  'Reject', 'ghost'));
      return b.join(' ') || '<span class="muted">—</span>';
    };

    // One delegated listener for every action button, present and future —
    // rows are re-rendered wholesale on each refresh, so per-element binding
    // would have to be redone every time.
    document.addEventListener('click', ev => {
      const el = ev.target.closest('button[data-act][data-order-id]');
      if (!el) return;
      const fn = ACTIONS[el.dataset.act];
      if (fn) fn(el.dataset.orderId);
    });

    // ONE table, every restaurant mixed together, newest first.
    //
    // The server already returns the rows ORDER BY created_at DESC, so this
    // does NOT re-sort: re-deriving the order client-side would be a second
    // definition of "newest" free to disagree with the server's. The auto-
    // refresh below re-fetches, so an order placed a moment ago arrives at the
    // top on its own.
    // Terminal statuses, mirrored from the backend's own terminal set. Used
    // ONLY for presentation — which rows read as finished. It decides no
    // buttons: those come from the server's can_* flags, so this list being
    // wrong could never enable an action the server would refuse.
    const DONE = ['COMPLETED', 'CANCELLED', 'ABANDONED', 'PICKED_UP'];
    const isDone = o => DONE.includes((o.status || '').toUpperCase());

    function render(orders) {
      const live = orders.filter(o => !isDone(o)).length;
      document.getElementById('order-count').textContent = orders.length
        ? `${orders.length} order${orders.length === 1 ? '' : 's'} · ${live} still active`
        : '';
      const rows = orders.map(o => `
        <tr class="${isDone(o) ? 'done' : ''}">
          <td>
            <div class="ident">
              <input class="label-edit" data-ident="${esc(o.identifier)}"
                     value="${esc(o.label || '')}" placeholder="add a name…"
                     onblur="saveLabel(this)"
                     onkeydown="if(event.key==='Enter'){this.blur();}">
              <span class="raw">${esc(o.identifier) || '<i>unknown</i>'}</span>
            </div>
          </td>
          <td style="white-space:nowrap">${esc(o.outlet_name) || '—'}</td>
          <td class="muted" style="white-space:nowrap">${esc(o.created_at_ist) || '—'}</td>
          <td class="otp">${esc(o.pickup_code) || '<span class="muted" style="font-size:12px">—</span>'}</td>
          <td>${pill(o.status, o.status)}</td>
          <td>${(o.items||[]).map(i => esc(i.quantity)+'× '+esc(i.name)).join('<br>')}</td>
          <td style="white-space:nowrap">${actionButtons(o)}</td>
        </tr>`).join('');
      document.getElementById('orders').innerHTML = rows
        ? `<table><thead><tr>
             <th>Identifier / label</th><th>Restaurant</th><th>Placed (IST)</th>
             <th>OTP</th><th>Status</th><th>Items</th><th>Actions</th>
           </tr></thead><tbody>${rows}</tbody></table>`
        : '<div class="empty">no orders placed on this day</div>';
    }

    // ------------------- scheduled pickup / engine observability ------------
    //
    // WHY THE COUNTDOWN IS ANCHORED TO A SERVER NUMBER, NOT TO release_at.
    //
    // The obvious version parses release_at and subtracts Date.now(). That puts
    // the customer-facing question "is this order due yet" on the BROWSER's
    // clock, and a laptop a couple of minutes off — which is ordinary — would
    // show a countdown that disagrees with the server by exactly that much. The
    // page would read "releases in 40s" while the backend had already released
    // it, or worse the other way round, and the whole point of this section is
    // that the displayed moment can be TRUSTED against what the engine did.
    //
    // So the server sends seconds_until_release, computed against ITS clock, and
    // the local ticker only ever counts ELAPSED time since the fetch. Elapsed
    // time is the one thing a local clock measures reliably regardless of how
    // wrong its absolute time is. Every poll re-anchors, so drift cannot
    // accumulate either.
    let scheduledRows = [];
    let scheduledFetchedAt = 0;

    const fmtSecs = s => {
      if (s === null || s === undefined) return '—';
      const neg = s < 0;
      let v = Math.abs(Math.round(s));
      const h = Math.floor(v / 3600), m = Math.floor((v % 3600) / 60), sec = v % 60;
      const body = h ? `${h}h ${m}m ${sec}s` : (m ? `${m}m ${sec}s` : `${sec}s`);
      return (neg ? '−' : '') + body;
    };
    // Seconds as minutes for the engine's own numbers — mu of 420 reads as
    // "7m 0s" here, which is how anyone actually thinks about prep time.
    const fmtDur = s => (s === null || s === undefined) ? '—' : fmtSecs(s);

    // The live remaining time for one row: the server's number minus however
    // long ago we fetched it. Null for anything not currently held.
    function remainingFor(o) {
      if (o.seconds_until_release === null || o.seconds_until_release === undefined)
        return null;
      return o.seconds_until_release - (Date.now() - scheduledFetchedAt) / 1000;
    }

    function countdownCell(o) {
      if (o.state !== 'held')
        return '<span class="muted">—</span>';
      const left = remainingFor(o);
      const due = left <= 0;
      // "due — releasing" rather than a negative number dressed up as a wait:
      // past zero the honest statement is that the release is owed and the next
      // pass performs it, which is a different thing from "0s left".
      return `<span class="countdown ${due ? 'due' : ''}" data-order="${esc(o.order_id)}">`
           + (due ? 'due — releasing…' : 'in ' + fmtSecs(left)) + '</span>';
    }

    // Re-paints ONLY the countdown cells, once a second, between the 15s polls.
    // Deliberately not a full re-render: this section can be watched for
    // minutes, and rebuilding the table every second would fight text selection
    // and burn battery for no new information. Everything else on the row only
    // changes when the server says so.
    function tickCountdowns() {
      for (const o of scheduledRows) {
        const el = document.querySelector(`.countdown[data-order="${CSS.escape(o.order_id)}"]`);
        if (!el || o.state !== 'held') continue;
        const left = remainingFor(o);
        const due = left <= 0;
        el.classList.toggle('due', due);
        el.textContent = due ? 'due — releasing…' : 'in ' + fmtSecs(left);
      }
    }

    function renderScheduled(rows) {
      scheduledRows = rows || [];
      // Stamped at RENDER, not at request start: the elapsed-time anchor has to
      // begin from the moment the numbers were true on this page.
      scheduledFetchedAt = Date.now();
      const held = scheduledRows.filter(o => o.state === 'held').length;
      document.getElementById('scheduled-count').textContent = scheduledRows.length
        ? `${scheduledRows.length} scheduled · ${held} still held`
        : '';
      const body = scheduledRows.map(o => `
        <tr class="${o.state === 'held' ? '' : 'done'}">
          <td>
            <div class="ident">
              <span>${esc(o.label) || '<i class="muted">no label</i>'}</span>
              <span class="raw">${esc(o.identifier) || '<i>unknown</i>'}</span>
            </div>
          </td>
          <td style="white-space:nowrap">${esc(o.outlet_name) || '—'}</td>
          <!-- The OTP belongs on THIS table too. A held order having a code is
               the single most counter-intuitive thing about the feature, and
               seeing it sat next to the word "held" settles the question
               without anyone opening the app. -->
          <td class="otp">${esc(o.pickup_code) || '<span class="muted" style="font-size:12px">—</span>'}</td>
          <td>${pill(o.state, o.state.replace('_', ' '))}
              <div class="math">${esc(o.status)}</div></td>
          <td class="num" style="white-space:nowrap">${esc(o.requested_pickup_at_ist) || '—'}</td>
          <td class="num" style="white-space:nowrap">${esc(o.release_at_ist)
              || (o.released_at_ist ? esc(o.released_at_ist) + ' <span class="muted">(fired)</span>' : '—')}</td>
          <td>${countdownCell(o)}</td>
          <!-- The justification, spelled out as the sum it actually is. Reading
               left to right this is the formula in the section header with real
               values in it, so the release moment above can be checked by hand. -->
          <td class="math">
            mu ${fmtDur(o.implied_mu_s !== null && o.implied_mu_s !== undefined
                        ? o.implied_mu_s : o.mu_ready_s)}
            + margin ${fmtDur(o.safety_margin_s)}
            = lead ${fmtDur(o.lead_s)}
            ${o.mu_source ? '<br><span class="muted">mu from ' + esc(o.mu_source) + '</span>' : ''}
          </td>
          <td class="math">${o.decisions || 0}×
            ${o.last_decision_at_ist ? '<br>' + esc(o.last_decision_at_ist) : ''}
          </td>
        </tr>`).join('');
      document.getElementById('scheduled').innerHTML = body
        ? `<table><thead><tr>
             <th>Identifier / label</th><th>Restaurant</th><th>OTP</th>
             <th>State</th><th>Requested pickup (IST)</th>
             <th>Release at (IST)</th><th>Releases</th>
             <th>Why that moment</th><th>Re-derived</th>
           </tr></thead><tbody>${body}</tbody></table>`
        : '<div class="empty">no scheduled orders on this day</div>';
    }

    // Outlet health kept as its own strip. It is NOT grouping — the orders no
    // longer hang off it — but open/closed and the hours are still worth seeing
    // and had nowhere else to live once the per-outlet sections went.
    function renderOutlets(outlets) {
      document.getElementById('outlets').innerHTML = outlets.map(ou => `
        <div style="display:flex;align-items:center;gap:10px;padding:4px 0">
          <span style="min-width:200px">${esc(ou.name)}</span>
          ${pill(ou.order_status, ou.order_status.replace('_',' '))}
          ${ou.is_manually_closed ? '<span class="pill closed">manually closed</span>' : ''}
          <span class="muted">${ou.opening_time ? esc(ou.opening_time)+'–'+esc(ou.closing_time) : ''}</span>
        </div>`).join('') || '<div class="empty">no outlets</div>';
    }

    async function loadCompliance() {
      const c = await api('/api/compliance');
      const li = t => `<li>${esc(t.label || t.identifier)}
        ${t.label ? '<span class="muted">· '+esc(t.identifier)+'</span>' : ''}
        ${t.order_count ? '<span class="muted">('+t.order_count+')</span>' : ''}</li>`;
      document.getElementById('ordered').innerHTML =
        c.ordered.map(li).join('') || '<li class="muted">nobody yet</li>';
      document.getElementById('not-ordered').innerHTML =
        c.not_ordered.map(li).join('') || '<li class="muted">everyone ordered</li>';
      document.getElementById('window-label').textContent =
        '(' + new Date(c.window_start_utc).toLocaleString() + ' → '
            + new Date(c.window_end_utc).toLocaleString() + ')';
    }

    let editing = false;
    document.addEventListener('focusin', e => { if (e.target.classList.contains('label-edit')) editing = true; });
    document.addEventListener('focusout', e => { if (e.target.classList.contains('label-edit')) editing = false; });

    // "Today" in IST, not in the device's timezone — the server defaults the
    // day to Asia/Kolkata (as the compliance window and outlet hours already
    // do), so a tester on a laptop set to another zone must still be shown the
    // same day the backend means. en-CA formats as YYYY-MM-DD.
    const istToday = () => new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit',
    }).format(new Date());

    function setDay(d) {
      document.getElementById('day').value = d;
      refreshAll();
    }

    async function refreshAll() {
      const status = document.getElementById('status');
      status.textContent = 'refreshing…';
      const day = document.getElementById('day').value;
      try {
        const [outlets, orders, scheduled] = await Promise.all([
          api('/api/outlets'),
          api('/api/orders' + (day ? '?day=' + encodeURIComponent(day) : '')),
          api('/api/scheduled' + (day ? '?day=' + encodeURIComponent(day) : '')),
        ]);
        if (!editing) {            // don't clobber an in-progress label edit
          render(orders);
          renderOutlets(outlets);
        }
        // Rendered OUTSIDE the editing guard, unlike the tables above. That
        // guard exists to protect a half-typed label from being overwritten
        // mid-keystroke; this section contains no inputs to protect, and
        // freezing a countdown because someone is naming a tester elsewhere on
        // the page would be a bug, not caution.
        renderScheduled(scheduled);
        await loadCompliance();
        status.textContent = 'updated ' + new Date().toLocaleTimeString();
      } catch (e) { status.textContent = 'error: ' + e.message; }
    }

    document.getElementById('day').value = istToday();

    // The one-second countdown ticker. setInterval IS right here, unlike the
    // refresh loop below: this fires no network request and cannot stack — it
    // rewrites at most a handful of text nodes and returns. The 15s poll
    // re-anchors it each round.
    setInterval(tickCountdowns, 1000);

    // Self-scheduling, NOT setInterval.
    //
    // refreshAll() fans out to THREE backend calls (/api/outlets, /api/orders,
    // /api/compliance), and the backend is on Render's free plan — a cold one
    // takes ~45s to answer. A fixed 15s interval kept firing into that: three
    // ticks would land before the first round replied, so one tab could sit on
    // nine in-flight requests, and every extra tab multiplied it. The timer had
    // no idea whether the previous round had finished, because it never asked.
    //
    // Awaiting the round before scheduling the next one makes overlap
    // structurally impossible rather than unlikely: there is exactly one chain,
    // and the next setTimeout is not armed until the current await has settled.
    // The 15s is therefore now a GAP BETWEEN rounds, not a period — a slow
    // round delays the next one instead of stacking on top of it.
    (async function refreshLoop() {
      // A round is skipped while a label edit is open, exactly as before, but
      // the cadence continues so the loop resumes on its own afterwards.
      if (!editing) {
        try {
          await refreshAll();
        } catch (_) {
          // refreshAll already reports failures in the status line. Swallowed
          // here only so a throw can never escape and kill the loop — that
          // would freeze the page silently, which is worse than a stale read.
        }
      }
      setTimeout(refreshLoop, 15000);
    })();
  </script>
</body>
</html>
