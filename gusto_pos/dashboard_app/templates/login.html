<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gusto Testing — Login</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:#0f1115; color:#e7e9ee;
           font:15px/1.5 system-ui, sans-serif; }
    form { background:#181b22; border:1px solid #2a2f3a; border-radius:14px;
           padding:28px; width:320px; }
    h1 { font-size:18px; margin:0 0 20px; }
    label { display:block; font-size:12px; color:#9aa2b1; margin:14px 0 4px; }
    input { width:100%; background:#0f1115; border:1px solid #2a2f3a;
            color:#e7e9ee; border-radius:8px; padding:10px; }
    button { width:100%; margin-top:20px; background:#6b8afd; color:#fff;
             border:0; border-radius:8px; padding:11px; font-weight:600;
             cursor:pointer; }
    .err { color:#e74c3c; font-size:13px; margin-top:12px; min-height:16px; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Gusto — Testing Dashboard</h1>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" />
    <button type="submit">Log in</button>
    <div class="err">{{ERROR}}</div>
  </form>
</body>
</html>
