[pytest]
asyncio_mode = auto
# One event loop for the whole session. The app's SQLAlchemy async engine is a
# module-level singleton with a connection pool; a per-test loop leaves pooled
# connections bound to a closed loop, which surfaces as errors that only appear
# when tests run together (each one passes in isolation).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_api_*.py
addopts = -q --tb=short -p no:cacheprovider -W ignore::DeprecationWarning
