# Render Blueprint for the Gusto POS FastAPI backend.
#
# Secrets are NOT stored here. Every `sync: false` var must be set by hand in the
# Render dashboard (Environment tab) before the first deploy succeeds.
services:
  - type: web
    name: gusto-pos-backend
    runtime: python
    rootDir: gusto_pos/backend
    plan: free
    region: singapore
    # Quoted: unquoted 21_7 is parsed as the integer 217 (YAML digit separators).
    branch: "21_7"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # `/`, not `/docs`. Swagger is now gated off unless APP_ENV names a dev
    # environment (app/main.py), so /docs 404s in production and a health check
    # pointed at it would mark a perfectly healthy service as down. `/` is the
    # better probe anyway: it is a real handler returning
    # {"status": "active", ...} rather than a generated documentation page.
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- Secrets: set these in the Render dashboard, never in this file ---
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false

      # --- Auth posture for a publicly reachable deploy ---
      # Keep "false". While true the customer OTP path is an OPEN login for
      # ANYONE holding the URL/APK: OTP_STUB_MODE accepts any phone plus the
      # static stub code 000000 and creates a Customer row. Staff/owner login is
      # unaffected either way.
      #
      # NOTE (2026-08-05): this value does NOT drive the running service. Render
      # applies blueprint envVars at creation/sync; a value set in the dashboard
      # wins for an existing key, and ordinary git auto-deploys do not re-apply
      # them. The dashboard has held "false" throughout — confirmed both by
      # probing /api/v1/customer/auth/request-otp (503) and by reading the
      # Environment tab. The earlier flip to "true" therefore never took effect.
      # To actually change auth posture, change it in the Render dashboard and
      # verify by probing the endpoint — never infer it from this file.
      - key: CUSTOMER_AUTH_ENABLED
        value: "false"

      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: OTP_RATE_LIMIT_PER_HOUR
        value: "5"

      # Payment gateway. PAYMENT_GATEWAY is the ONLY selector — get_gateway()
      # returns CashfreeGateway for "cashfree" and StubRazorpayGateway for
      # anything else, including a typo.
      #
      # This said "stub" from the blueprint's first commit (d15b7578) and was
      # never revisited. INCIDENT 2026-09-08: tapping Pay created the order but
      # never opened the Cashfree sheet. Not a crash — the stub returns a
      # razorpay-shaped session, so `order.payment.isCashfree` is false and
      # checkout_screen.dart takes its early-return stub branch before
      # openCheckout() is ever reached. Confirmed against the live DB: the ten
      # most recent payment_transactions rows all recorded gateway='razorpay'.
      #
      # As with CUSTOMER_AUTH_ENABLED and FIREBASE_ENABLED above, changing this
      # file does NOT change the running service — set it in the Render
      # dashboard. Verify by placing one order and reading back:
      #   SELECT gateway FROM payment_transactions ORDER BY created_at DESC;
      # 'cashfree' = live. 'razorpay' = still on the stub.
      #
      # PAYMENT_GATEWAY_SHAPE is REMOVED, not corrected. get_gateway() ignores
      # it — its own docstring calls it "a legacy alias" and records that the
      # factory once read SHAPE while /payment/simulate read PAYMENT_GATEWAY,
      # "which is how you end up with a 'real gateway' deploy still serving
      # stub orders". Leaving a second, ignored knob named after a gateway is
      # what made this incident readable as configured-for-razorpay.
      - key: PAYMENT_GATEWAY
        value: cashfree

      # REQUIRED once PAYMENT_GATEWAY=cashfree. The factory refuses to start an
      # order without them rather than silently falling back to stub, so
      # flipping the selector WITHOUT these set turns checkout into a hard
      # failure instead of a wrong-but-working stub. Set both in the dashboard
      # before flipping. CASHFREE_ENV defaults to "sandbox" in config.py —
      # production is an explicit opt-in, so it must be set too for real money.
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        sync: false
      - key: CASHFREE_NOTIFY_URL
        sync: false
      # Firebase phone-OTP and Google sign-in. TRUE in production: both
      # /customer/auth/firebase and /customer/auth/google raise 501
      # "Firebase authentication is not enabled on this deployment" when this
      # is false, and with CUSTOMER_AUTH_ENABLED=false closing the stub path
      # there is then NO way to log in at all.
      #
      # This file said "false" while prod ran "true" (SESSION_HANDOFF.md), so
      # the record disagreed with reality. Corrected here — but see the note on
      # CUSTOMER_AUTH_ENABLED above: changing this value does NOT change the
      # running service. The dashboard wins for an existing key. To actually
      # change it, change it in the Render dashboard and verify by probing:
      #
      #   curl -X POST .../api/v1/customer/auth/firebase \
      #        -H 'Content-Type: application/json' -d '{"id_token":"probe"}'
      #
      #   501 = disabled (login is DOWN)   401 = enabled (healthy: the gate
      #   passed and token verification ran, then rejected the junk token)
      - key: FIREBASE_ENABLED
        value: "true"

  # --------------------------------------------------------------------------
  # CareVo Admin Dashboard (internal). PREPPED, NOT DEPLOYED.
  #
  # Before the first deploy:
  #   1. Migration 003 must be applied (Checkpoint A) — until then every
  #      /api/v1/admin/* route 500s on the missing verification_status column.
  #   2. At least one staff user must hold the SUPER_ADMIN role, or nobody can
  #      log in past the role check.
  #   3. Set NEXT_PUBLIC_API_URL below to the real backend URL. It is baked in
  #      at BUILD time (NEXT_PUBLIC_*), so changing it later needs a rebuild,
  #      not just a restart.
  #
  # This dashboard is an internal tool with no IP allowlist and no second
  # factor — its only gate is staff password + SUPER_ADMIN role. Worth deciding
  # whether it should be public on the internet at all before clicking deploy.
  # --------------------------------------------------------------------------
  - type: web
    name: carevo-admin-dashboard
    runtime: node
    rootDir: admin_app
    plan: free
    region: singapore
    # Quoted: unquoted 21_7 is parsed as the integer 217 (YAML digit separators).
    branch: "21_7"
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Build-time public var — points the dashboard at the backend service.
      - key: NEXT_PUBLIC_API_URL
        sync: false
