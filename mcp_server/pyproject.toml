[project]
name = "carevo-mcp"
version = "0.1.0"
description = "Read-only MCP server for public CareVo / Gusto Skip information"
requires-python = ">=3.11"
dependencies = ["mcp>=2.1.1,<3"]

[project.scripts]
carevo-mcp = "carevo_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["carevo_mcp"]
