[project]
name = "carevo-mcp"
# Keep in step with the `version=` passed to MCPServer in carevo_mcp/server.py —
# that is the number a client sees in the initialize handshake, and the two
# reading differently makes "which build is deployed" unanswerable.
version = "0.2.0"
description = "Read-only MCP server for public CareVo / Gusto Skip information"
requires-python = ">=3.11"
# httpx: the catalogue tools read the backend's public HTTP endpoints.
# uvicorn: only needed for the streamable-http transport; the MCP SDK calls it
# internally, and a stdio-only install never imports it.
#
# requirements.txt carries these SAME constraints and must be edited with this
# line. They drifted once, and the result was a requirements-only install that
# imported nothing.
dependencies = ["mcp>=2.1.1,<3", "httpx>=0.27", "uvicorn>=0.24"]

[project.scripts]
carevo-mcp = "carevo_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["carevo_mcp"]
