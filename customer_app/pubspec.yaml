name: customer_app
description: "CareVo Skip — self-pickup restaurant ordering (neobrutalist retro diner)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI / fonts
  google_fonts: ^6.2.1

  # Networking
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Location
  geolocator: ^13.0.2

  # Persistence (token + theme)
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.3

  # UPI intent deep-link (upi://pay) to open the user's UPI app
  url_launcher: ^6.3.0
  flutter_google_places_sdk: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # On-device live test for the Places SDK integration.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
